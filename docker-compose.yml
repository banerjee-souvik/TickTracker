services:
  mongo:
    image: mongo:7
    container_name: ticktracker_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ticktracker

  backend:
    build: ./backend
    container_name: ticktracker_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - mongo
    volumes:
      - ./backend:/app

volumes:
  mongo_data:
